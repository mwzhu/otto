[project]
name = "otto-director-agent"
version = "0.1.0"
description = "LiveKit Agents worker for Otto director voice interviews."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "livekit-agents[cartesia,deepgram,turn-detector]~=1.5",
  "livekit-plugins-silero~=1.2",
  "pyyaml>=6.0",
  "otto-realtime-core",
]

[project.scripts]
otto-director-agent = "director_agent.worker:main"
otto-director-preflight = "director_agent.preflight:main"
otto-director-proof-readiness = "director_agent.proof_readiness:main"
otto-director-schema-check = "director_agent.schema_contract:main"
otto-director-turn-smoke = "director_agent.smoke:main"
otto-director-session-verify = "director_agent.verify:main"

[tool.uv]
package = true

[tool.uv.sources]
otto-realtime-core = { path = "../realtime_core", editable = true }

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
