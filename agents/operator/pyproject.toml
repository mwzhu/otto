[project]
name = "otto-operator-agent"
version = "0.1.0"
description = "LiveKit Agents worker for Otto operator workflow capture."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "livekit-agents[cartesia,deepgram,turn-detector]~=1.5",
  "livekit-plugins-silero~=1.2",
  "otto-realtime-core",
]

[project.scripts]
otto-operator-agent = "operator_agent.worker:main"

[tool.uv]
package = true

[tool.uv.sources]
otto-realtime-core = { path = "../realtime_core", editable = true }

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
